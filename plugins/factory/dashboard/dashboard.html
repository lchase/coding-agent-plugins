<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Board</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --card: #fff; --card-hover: #f9fafb; --line: #e3e5ea;
    --ink: #1b1e24; --muted: #6b7280; --faint: #9aa0ad;
    --live: #2563eb; --pass: #15803d; --changes: #c2410c; --human: #b45309; --merged: #6d28d9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121317; --panel: #191b21; --card: #1f2128; --card-hover: #252832; --line: #2b2e38;
      --ink: #e5e7eb; --muted: #9ca3af; --faint: #5f6677;
      --live: #7dd3fc; --pass: #4ade80; --changes: #fdba74; --human: #f9a8d4; --merged: #c4b5fd;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121317; --panel: #191b21; --card: #1f2128; --card-hover: #252832; --line: #2b2e38;
    --ink: #e5e7eb; --muted: #9ca3af; --faint: #5f6677;
    --live: #7dd3fc; --pass: #4ade80; --changes: #fdba74; --human: #f9a8d4; --merged: #c4b5fd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 24px 28px 8px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pass); margin-right: 7px; vertical-align: 1px; }
  .status.err { color: var(--changes); } .status.err::before { background: var(--changes); }

  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; padding: 16px 28px 24px; align-items: start; }
  .col { min-width: 0; }
  .col-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .col-head .who { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .col.human h2 { color: var(--human); } .col.merged h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 2px; }

  .card { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 10px; margin-bottom: 10px; transition: background .15s, border-color .15s; }
  .card:hover { background: var(--card-hover); }
  .card:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  .card.live { border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
  .card.human { border-color: var(--human); box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 35%, transparent); }
  .card.merged { opacity: .65; }
  .card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
  .num { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 1.6s ease-in-out infinite; }
  .flag { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--human); white-space: nowrap; }
  .title { font-size: 13px; line-height: 1.4; margin: 0 0 4px; font-weight: 500; }
  .branch { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rounds { margin-top: 9px; display: grid; gap: 4px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 20px; }
  .chip { flex: 1; text-align: center; font-family: var(--mono); font-size: 10px; padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint); }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS { border-color: transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 15%, transparent); }
  .chip.CHANGES { border-color: transparent; color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .note { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .note code { font-family: var(--mono); font-size: 10.5px; color: var(--human); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait { animation: none; } }

  footer { padding: 0 28px 24px; font-family: var(--mono); font-size: 11px; color: var(--faint); display: flex; gap: 18px; flex-wrap: wrap; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 100vw); background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; transform: translateX(100%); transition: transform .22s ease; }
  body.open .scrim { opacity: 1; pointer-events: auto; }
  body.open .drawer { transform: none; }
  .d-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head h3 { margin: 3px 40px 4px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; }
  .close:hover { color: var(--ink); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 190px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 12px 8px; overflow-y: auto; }
  .group { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 12px 8px 4px; }
  .group:first-child { margin-top: 0; }
  .file { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .file:hover { background: var(--card); color: var(--ink); }
  .file.on { background: var(--card-hover); color: var(--ink); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.good { background: var(--pass); } .dot.warn { background: var(--changes); } .dot.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 20px 26px 60px; min-width: 0; }

  .md { max-width: 660px; line-height: 1.6; }
  .md h1, .md h2, .md h3 { line-height: 1.3; margin: 1.5em 0 .5em; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 14.5px; } .md h3 { font-size: 13.5px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code { font-family: var(--mono); font-size: 12px; background: var(--card); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  .md pre code { background: none; border: 0; padding: 0; }
  .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; margin-bottom: 14px; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 15%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }

  @media (max-width: 1100px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 24px; } }
  @media (max-width: 640px) {
    header, footer { padding-left: 16px; padding-right: 16px; }
    .board { grid-template-columns: 1fr; padding: 12px 16px 24px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; padding: 8px; }
    .group { display: none; } .file { width: auto; white-space: nowrap; }
    .doc { padding: 16px; }
  }
</style>
</head>
<body>
<header><h1>Factory</h1><div class="status" id="status">connecting…</div></header>
<main class="board" id="board"></main>
<footer>
  <span>/factory &lt;feature&gt;</span><span>/factory next</span>
  <span>/factory approve &lt;job-id&gt;</span><span>/factory rework &lt;job-id&gt; &lt;note&gt;</span>
</footer>

<div class="scrim" data-close></div>
<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="d-head">
    <div class="num" id="d-num"></div><h3 id="d-title"></h3><div class="branch" id="d-branch"></div>
    <button class="close" data-close aria-label="Close">×</button>
  </div>
  <div class="d-body"><nav class="files" id="d-files"></nav><article class="doc"><div class="md" id="d-doc"></div></article></div>
</aside>

<script>
const POLL_MS = 2000;
const STAGES = [
  ["spec", "Spec", "spec-writer · opus"], ["build", "Build", "builder · opus"], ["review", "Review", "sec · ux · ui · code"],
  ["approve", "Approve", "approver · opus"], ["merged", "Merged", "main", "merged"], ["needs-human", "Needs human", "approve · rework", "human"],
];
const LIVE = new Set(["spec", "build", "review", "approve"]);
const REVIEWERS = [["security", "sec"], ["ux", "ux"], ["ui", "ui"], ["code", "code"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let jobs = [], lastBoard = "", openId = null, openPath = null, openText = null;

// ---- board ----
function chips(n, v, waiting) {
  return `<div class="round"><span class="r">R${n}</span>` + REVIEWERS.map(([k, s]) => {
    const cls = v[k] === "PASS" || v[k] === "CHANGES" ? v[k] : waiting ? "wait" : "";
    return `<span class="chip ${cls}" title="${k}: ${esc(v[k] || "pending")}">${s}</span>`;
  }).join("") + `</div>`;
}
function card(j) {
  const live = LIVE.has(j.stage), human = j.stage === "needs-human";
  const rows = (j.rounds || []).map((v, i) => chips(i + 1, v, false));
  if (j.round > 0 && j.reviews) rows.push(chips(j.round, j.reviews, j.stage === "review"));
  const note = human ? `<div class="note">${j.note ? esc(j.note) + "<br>" : ""}<code>/factory approve ${esc(j.id)}</code></div>`
             : j.note ? `<div class="note">${esc(j.note)}</div>` : "";
  return `<button class="card ${live ? "live" : ""} ${human ? "human" : ""} ${j.stage === "merged" ? "merged" : ""}" data-job="${esc(j.id)}">
    <div class="card-top">${live ? '<span class="pulse" aria-label="running"></span>' : ""}<span class="num">${esc(j.id)}</span>${human ? '<span class="flag">your call</span>' : ""}</div>
    <p class="title">${esc(j.title || j.id)}</p><div class="branch">${esc(j.branch || "")}</div>
    ${rows.length ? `<div class="rounds">${rows.join("")}</div>` : ""}${note}</button>`;
}
function render() {
  const html = STAGES.map(([k, label, who, cls]) => {
    const inCol = jobs.filter(j => j.stage === k);
    const cards = inCol.slice().reverse().map(card).join("");
    return `<section class="col ${cls || ""}"><div class="col-head"><h2>${label}</h2><span class="who">${who}</span><span class="count">${inCol.length || ""}</span></div>${cards || '<div class="empty">none</div>'}</section>`;
  }).join("");
  if (html !== lastBoard) { lastBoard = html; $("board").innerHTML = html; }
}
async function poll() {
  const st = $("status");
  try {
    const r = await fetch("board.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`board.json: HTTP ${r.status}`);
    jobs = (await r.json()).jobs || [];
    render();
    if (openId) await refreshDrawer();
    st.className = "status"; st.textContent = `${jobs.length} jobs · ${new Date().toLocaleTimeString()}`;
  } catch (e) { st.className = "status err"; st.textContent = e.message; }
}

// ---- drawer ----
const tone = first => /^(VERDICT:\s*PASS|APPROVE|STATUS:\s*READY)$/.test(first) ? "good"
  : /^VERDICT:\s*CHANGES$/.test(first) ? "warn" : /^(ESCALATE|STATUS:\s*BLOCKED)$/.test(first) ? "stop" : "";
const texts = new Map(); // "<job>/<file>" -> content; reviews are immutable once written, so cached

async function fetchJobFile(j, f) {
  const r = await fetch(`jobs/${encodeURIComponent(j.id)}/${f}`, { cache: "no-store" });
  return r.ok ? r.text() : null;
}
async function refreshDrawer() {
  const j = jobs.find(x => x.id === openId); if (!j) return;
  $("d-num").textContent = `${j.id} · ${j.stage}${j.round ? ` · round ${j.round}` : ""}`;
  $("d-title").textContent = j.title || j.id; $("d-branch").textContent = j.branch || "";

  const rounds = Math.max(j.round || 0, (j.rounds || []).length);
  const names = ["feature.md", "spec.md", "build.md", "decision.md"];
  for (let n = 1; n <= rounds; n++) for (const [k] of [...REVIEWERS, ["human"]]) names.push(`round-${n}/review-${k}.md`);
  const files = [];
  await Promise.all(names.map(async f => {
    const key = `${j.id}/${f}`;
    if (!texts.has(key) || f === openPath || !f.includes("/")) {
      const t = await fetchJobFile(j, f);
      if (t === null) { texts.delete(key); return; }
      texts.set(key, t);
    }
    files.push(f);
  }));
  files.sort((a, b) => names.indexOf(a) - names.indexOf(b));
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null;

  let group = null;
  $("d-files").innerHTML = files.map(f => {
    const g = f.includes("/") ? f.split("/")[0].replace("round-", "Round ") : "Job";
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ""; group = g;
    const label = f.includes("/") ? f.split("/")[1].replace(/^review-|\.md$/g, "") : f;
    return `${head}<button class="file ${f === openPath ? "on" : ""}" data-file="${esc(f)}"><span class="dot ${tone((texts.get(`${j.id}/${f}`) || "").split("\n")[0].trim())}"></span>${esc(label)}</button>`;
  }).join("") || '<div class="empty">No files yet.</div>';

  const text = openPath ? texts.get(`${j.id}/${openPath}`) : null;
  if (text !== openText) { openText = text; $("d-doc").innerHTML = text == null ? '<p class="empty">Nothing written yet.</p>' : markdown(text); }
}
function openDrawer(id) { openId = id; openPath = null; openText = undefined; document.body.classList.add("open"); refreshDrawer(); }
function closeDrawer() { openId = null; document.body.classList.remove("open"); }
document.addEventListener("click", e => {
  const c = e.target.closest("[data-job]"); if (c) return openDrawer(c.dataset.job);
  const f = e.target.closest("[data-file]"); if (f) { openPath = f.dataset.file; openText = undefined; $("d-doc").parentElement.scrollTop = 0; return refreshDrawer(); }
  if (e.target.closest("[data-close]")) closeDrawer();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// ---- markdown: headings, fences, lists (+ tasks), tables, paragraphs, inline code/bold/links ----
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function markdown(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  let i = 0, html = "";
  const t = tone(lines[0].trim());
  if (t) { html += `<div class="verdict ${t}">${esc(lines[0].trim())}</div>`; i = 1; }
  const isList = l => /^\s*([-*+]|\d+\.)\s+/.test(l);
  const isBlock = l => /^(#{1,6}\s|```|\|)/.test(l) || isList(l);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith("```")) { const b = []; i++; while (i < lines.length && !lines[i].startsWith("```")) b.push(lines[i++]); i++; html += `<pre><code>${esc(b.join("\n"))}</code></pre>`; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = Math.min(h[1].length, 3); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (line.startsWith("|")) {
      const rows = []; while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      html += "<table>" + rows.filter(r => !/^\|[\s:|-]+\|$/.test(r)).map((r, n) => `<tr>${cells(r).map(c => n ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("") + "</table>"; continue;
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++];
        if (isList(l)) items.push(l.replace(/^\s*([-*+]|\d+\.)\s+/, "")); else items[items.length - 1] += " " + l.trim();
      }
      html += (ordered ? "<ol>" : "<ul>") + items.map(x => { const m = x.match(/^\[([ xX])\]\s+(.*)$/); return m ? `<li class="task ${m[1] === " " ? "" : "done"}">${inline(m[2])}</li>` : `<li>${inline(x)}</li>`; }).join("") + (ordered ? "</ol>" : "</ul>"); continue;
    }
    const p = []; while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) p.push(lines[i++]);
    html += `<p>${inline(p.join(" "))}</p>`;
  }
  return html;
}

poll(); setInterval(poll, POLL_MS);
</script>
</body>
</html>
