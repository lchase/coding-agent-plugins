<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%235405bd'/%3E%3Cg transform='translate(2 2) scale(.75)' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 12V6l5-3 5 3v6l-5 3-5-3z'/%3E%3Cpath d='M3 6l5 3 5-3M8 9v6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f6f7f8; --panel: #fff; --card: #fff; --card-hover: #f1f3f4; --line: #dfe3e6; --line-strong: #c4cacf;
    --ink: #1c2023; --muted: #4a5259; --faint: #6b747b;
    --live: #0a8a91; --pass: #1d6b3f; --changes: #8a5a00; --human: #c24a00; --merged: #5405bd; --must: #b3261e;
    --primary: #5405bd; --code: #5405bd; --code-bg: #eceef0; --shadow: 0 4px 8px -2px #0000001f, 0 8px 16px 0 #00000014;
    --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c2023; --panel: #24292d; --card: #24292d; --card-hover: #2d3338; --line: #2d3338; --line-strong: #4a5259;
      --ink: #fcfcfd; --muted: #b7bcc1; --faint: #888e92;
      --live: #4bc4c9; --pass: #90cea7; --changes: #ffcc61; --human: #ff6300; --merged: #a794ff; --must: #f7a89c;
      --primary: #5405bd; --code: #beb3ff; --code-bg: #2d3338; --shadow: 0 4px 8px -2px #00000066, 0 8px 16px 0 #00000059;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c2023; --panel: #24292d; --card: #24292d; --card-hover: #2d3338; --line: #2d3338; --line-strong: #4a5259;
    --ink: #fcfcfd; --muted: #b7bcc1; --faint: #888e92;
    --live: #4bc4c9; --pass: #90cea7; --changes: #ffcc61; --human: #ff6300; --merged: #a794ff; --must: #f7a89c;
    --primary: #5405bd; --code: #beb3ff; --code-bg: #2d3338; --shadow: 0 4px 8px -2px #00000066, 0 8px 16px 0 #00000059;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/20px Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; min-height: 56px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); display: inline-flex; align-items: center; justify-content: center; }
  .ver { font-size: 12px; line-height: 16px; color: var(--faint); align-self: flex-end; margin: 0 0 4px -4px; }
  h1 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 500; }
  .status { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--muted); }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--live); margin-right: 8px; vertical-align: 0; animation: pulse 1.6s ease-in-out infinite; }
  .status.err { color: var(--human); } .status.err::before { background: var(--human); animation: none; }

  .board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px; padding: 24px; align-items: start; }
  .col { min-width: 0; }
  .col-head { display: flex; align-items: baseline; gap: 8px; padding: 0 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .col-head h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; }
  .col-head .who { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .col.human h2 { color: var(--human); } .col.merged h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; line-height: 16px; padding: 20px 12px; border: 1px dashed var(--line); border-radius: 4px; text-align: center; }

  .card { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line-strong); border-radius: 4px; padding: 12px; margin-bottom: 12px; transition: border-color .2s, box-shadow .2s; }
  .card:hover { border-color: var(--faint); box-shadow: var(--shadow); }
  .card:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--merged); }
  .card.human { border: 2px solid var(--human); padding: 11px; }
  .card.merged { background: var(--bg); border-color: var(--line); }
  .card.merged .title { color: var(--muted); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .num { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 1.6s ease-in-out infinite; }
  .flag { margin-left: auto; padding: 0 6px; border-radius: 4px; background: color-mix(in srgb, var(--human) 18%, transparent); color: var(--human); font-size: 11px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
  .repo { margin: -2px 0 6px; }
  .title { font-size: 14px; line-height: 20px; margin: 0 0 6px; font-weight: 500; }
  .branch { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rounds { margin-top: 12px; display: grid; gap: 4px; }
  .round { display: grid; grid-template-columns: 20px repeat(4, minmax(0, 1fr)); gap: 4px; align-items: center; }
  .round .r { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .chip { text-align: center; font-family: var(--mono); font-size: 11px; line-height: 16px; padding: 1px 0; border-radius: 4px; border: 1px dashed var(--line-strong); color: var(--muted); }
  .chip.wait { animation: pulse 1.6s ease-in-out infinite; }
  .chip.PASS { border-color: transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 18%, transparent); }
  .chip.CHANGES { border-color: transparent; color: var(--changes); background: color-mix(in srgb, var(--changes) 18%, transparent); }
  .note { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-strong); font-size: 12px; line-height: 16px; color: var(--muted); overflow-wrap: anywhere; }
  .cmd { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .cmd code { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .copy { flex: none; cursor: pointer; font-family: var(--mono); font-size: 11px; line-height: 16px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted); }
  .copy:hover { background: var(--card-hover); color: var(--ink); }
  .note code { font-family: var(--mono); font-size: 11px; color: var(--code); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait, .status::before { animation: none; } }

  .board { flex: 1; }
  footer { margin-top: auto; padding: 12px 24px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--faint); display: flex; gap: 24px; flex-wrap: wrap; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 100vw); background: var(--panel); border-left: 1px solid var(--line-strong); box-shadow: 0 12px 16px -4px #00000080, 0 24px 32px 0 #00000080; display: grid; grid-template-rows: auto 1fr; transform: translateX(100%); transition: transform .22s ease; }
  body.open .scrim { opacity: 1; pointer-events: auto; }
  body.open .drawer { transform: none; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line-strong); position: relative; }
  .d-head h3 { margin: 4px 48px 4px 0; font-size: 22px; line-height: 28px; font-weight: 500; }
  .close { position: absolute; top: 12px; right: 16px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; cursor: pointer; color: var(--ink); font-size: 24px; line-height: 1; transition: background .2s; }
  .close:hover { background: var(--card-hover); }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line-strong); padding: 16px 12px; overflow-y: auto; }
  .group { font-size: 12px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--faint); margin: 16px 0 4px; padding: 0 12px; }
  .group:first-child { margin-top: 0; }
  .file { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-family: var(--mono); font-size: 13px; line-height: 20px; color: var(--ink); transition: background .2s; }
  .file:hover { background: var(--card-hover); }
  .file.on { background: var(--code-bg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.good { background: var(--pass); } .dot.warn { background: var(--changes); } .dot.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 24px 32px 64px; min-width: 0; }

  .md { max-width: 660px; line-height: 20px; }
  .md h1, .md h2, .md h3 { line-height: 1.3; margin: 1.5em 0 .5em; font-weight: 500; }
  .md h1 { font-size: 18px; } .md h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); } .md h3 { font-size: 13px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md pre, .md table { margin: 0 0 1em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .25em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--primary); }
  .md code { font-family: var(--mono); font-size: 13px; background: var(--code-bg); color: var(--code); padding: 1px 6px; border-radius: 4px; }
  .md pre { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px; padding: 12px 16px; overflow-x: auto; }
  .md pre code { background: none; color: var(--ink); padding: 0; }
  .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line-strong); padding: 6px 10px; text-align: left; }
  .verdict { display: inline-flex; align-items: center; height: 24px; font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .02em; padding: 0 10px; border-radius: 4px; margin-bottom: 16px; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 18%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 18%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 18%, transparent); }

  @media (max-width: 1100px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 24px; } }
  @media (max-width: 640px) {
    header, footer { padding-left: 16px; padding-right: 16px; }
    .board { grid-template-columns: 1fr; padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--line-strong); display: flex; gap: 4px; overflow-x: auto; padding: 8px; }
    .group { display: none; } .file { width: auto; white-space: nowrap; }
    .doc { padding: 16px; }
  }
</style>
</head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V6l5-3 5 3v6l-5 3-5-3z"/><path d="M3 6l5 3 5-3M8 9v6"/></svg></span><h1>Factory</h1><span class="ver" id="ver"></span></div><div class="status" id="status">connecting…</div></header>
<main class="board" id="board"></main>
<footer>
  <span>/factory &lt;feature&gt;</span><span>/factory next</span>
  <span>/factory approve &lt;job-id&gt;</span><span>/factory rework &lt;job-id&gt; &lt;note&gt;</span><span>/factory pr-sync &lt;job-id&gt;</span>
</footer>

<div class="scrim" data-close></div>
<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="d-head">
    <div class="num" id="d-num"></div><h3 id="d-title"></h3><div class="branch" id="d-branch"></div>
    <button class="close" data-close aria-label="Close">×</button>
  </div>
  <div class="d-body"><nav class="files" id="d-files"></nav><article class="doc"><div class="md" id="d-doc"></div></article></div>
</aside>

<script>
const POLL_MS = 2000;
const STAGES = [
  ["spec", "Spec", "spec-writer · opus"], ["build", "Build", "builder · opus"], ["review", "Review", "sec · ux · ui · code"],
  ["approve", "Approve", "approver · opus"], ["pr-open", "PR review", "pr-sync"], ["ready", "Ready", "you merge", "human"],
  ["merged", "Merged", "main", "merged"], ["needs-human", "Needs human", "approve · rework", "human"],
];
const LIVE = new Set(["spec", "build", "review", "approve"]);
const REVIEWERS = [["security", "sec"], ["ux", "ux"], ["ui", "ui"], ["code", "code"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let jobs = [], lastBoard = "", openId = null, openPath = null, openText = null;

// ---- board ----
function chips(n, v, waiting) {
  return `<div class="round"><span class="r">R${n}</span>` + REVIEWERS.map(([k, s]) => {
    const cls = v[k] === "PASS" || v[k] === "CHANGES" ? v[k] : waiting ? "wait" : "";
    return `<span class="chip ${cls}" title="${k}: ${esc(v[k] || "pending")}">${s}</span>`;
  }).join("") + `</div>`;
}
const cmd = c => `<span class="cmd"><code>${esc(c)}</code><span class="copy" role="button" tabindex="0" data-copy="${esc(c)}" title="Copy" aria-label="Copy command">copy</span></span>`;
function card(j) {
  const live = LIVE.has(j.stage), human = j.stage === "needs-human" || j.stage === "ready";
  const rows = (j.rounds || []).map((v, i) => chips(i + 1, v, false));
  const cur = j.reviews && REVIEWERS.some(([k]) => j.reviews[k] === "PASS" || j.reviews[k] === "CHANGES");
  if (j.round > rows.length && j.reviews && (cur || j.stage === "review")) rows.push(chips(j.round, j.reviews, j.stage === "review"));
  const pr = j.pr ? `<div class="branch">PR #${esc(j.pr.number)}</div>` : "";
  const note = j.stage === "ready" ? `<div class="note">${esc(j.note || "all clear")}<br>${j.pr ? esc(j.pr.url) : ""}</div>`
             : j.stage === "pr-open" ? `<div class="note">${j.note ? esc(j.note) + "<br>" : ""}${cmd(`/factory pr-sync ${j.id}`)}</div>`
             : human ? `<div class="note">${j.note ? esc(j.note) + "<br>" : ""}${cmd(`/factory approve ${j.id}`)}</div>`
             : j.note ? `<div class="note">${esc(j.note)}</div>` : "";
  return `<div role="button" tabindex="0" class="card ${live ? "live" : ""} ${human ? "human" : ""} ${j.stage === "merged" ? "merged" : ""}" data-job="${esc(j.key)}">
    <div class="card-top">${live ? '<span class="pulse" aria-label="running"></span>' : ""}<span class="num">${esc(j.id)}</span>${human ? '<span class="flag">your call</span>' : ""}</div>
    <div class="branch repo">${esc(j.repo)}</div>
    <p class="title">${esc(j.title || j.id)}</p><div class="branch">${esc(j.branch || "")}</div>${pr}
    ${rows.length ? `<div class="rounds">${rows.join("")}</div>` : ""}${note}</div>`;
}
function render() {
  const html = STAGES.map(([k, label, who, cls]) => {
    const inCol = jobs.filter(j => j.stage === k);
    const cards = inCol.slice().reverse().map(card).join("");
    return `<section class="col ${cls || ""}"><div class="col-head"><h2>${label}</h2><span class="who">${who}</span><span class="count">${inCol.length || ""}</span></div>${cards || '<div class="empty">none</div>'}</section>`;
  }).join("");
  if (html !== lastBoard) { lastBoard = html; $("board").innerHTML = html; }
}
async function poll() {
  const st = $("status");
  try {
    const r = await fetch("board.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`board.json: HTTP ${r.status}`);
    const data = await r.json(); jobs = data.jobs || [];
    if (data.version) document.getElementById("ver").textContent = `v${data.version}`;
    render();
    if (openId) await refreshDrawer();
    st.className = "status"; st.textContent = `${jobs.length} jobs · ${new Date().toLocaleTimeString()}`;
  } catch (e) { st.className = "status err"; st.textContent = e.message; }
}

// ---- drawer ----
const tone = first => /^(VERDICT:\s*PASS|APPROVE|STATUS:\s*READY)$/.test(first) ? "good"
  : /^VERDICT:\s*CHANGES$/.test(first) ? "warn" : /^(ESCALATE|STATUS:\s*BLOCKED)$/.test(first) ? "stop" : "";
const texts = new Map(); // "<job>/<file>" -> content; reviews are immutable once written, so cached

async function fetchJobFile(j, f) {
  const r = await fetch(`jobs/${j.key.split("/").map(encodeURIComponent).join("/")}/${f}`, { cache: "no-store" });
  return r.ok ? r.text() : null;
}
async function refreshDrawer() {
  const j = jobs.find(x => x.key === openId); if (!j) return;
  $("d-num").textContent = `${j.key} · ${j.stage}${j.round ? ` · round ${j.round}` : ""}`;
  $("d-title").textContent = j.title || j.id; $("d-branch").textContent = j.branch || "";

  const rounds = Math.max(j.round || 0, (j.rounds || []).length);
  const names = ["feature.md", "spec.md", "build.md", "decision.md"];
  for (let n = 1; n <= rounds; n++) for (const [k] of [...REVIEWERS, ["human"], ["pr"]]) names.push(`round-${n}/review-${k}.md`);
  const files = [];
  await Promise.all(names.map(async f => {
    const key = `${j.key}/${f}`;
    if (!texts.has(key) || f === openPath || !f.includes("/")) {
      const t = await fetchJobFile(j, f);
      if (t === null) { texts.delete(key); return; }
      texts.set(key, t);
    }
    files.push(f);
  }));
  files.sort((a, b) => names.indexOf(a) - names.indexOf(b));
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null;

  let group = null;
  $("d-files").innerHTML = files.map(f => {
    const g = f.includes("/") ? f.split("/")[0].replace("round-", "Round ") : "Job";
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ""; group = g;
    const label = f.includes("/") ? f.split("/")[1].replace(/^review-|\.md$/g, "") : f;
    return `${head}<button class="file ${f === openPath ? "on" : ""}" data-file="${esc(f)}"><span class="dot ${tone((texts.get(`${j.key}/${f}`) || "").split("\n")[0].trim())}"></span>${esc(label)}</button>`;
  }).join("") || '<div class="empty">No files yet.</div>';

  const text = openPath ? texts.get(`${j.key}/${openPath}`) : null;
  if (text !== openText) { openText = text; $("d-doc").innerHTML = text == null ? '<p class="empty">Nothing written yet.</p>' : markdown(text); }
}
function openDrawer(id) { openId = id; openPath = null; openText = undefined; document.body.classList.add("open"); refreshDrawer(); }
function closeDrawer() { openId = null; document.body.classList.remove("open"); }
document.addEventListener("click", e => {
  const cp = e.target.closest("[data-copy]");
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy); cp.textContent = "copied"; setTimeout(() => { cp.textContent = "copy"; }, 1200); return; }
  const c = e.target.closest("[data-job]"); if (c) return openDrawer(c.dataset.job);
  const f = e.target.closest("[data-file]"); if (f) { openPath = f.dataset.file; openText = undefined; $("d-doc").parentElement.scrollTop = 0; return refreshDrawer(); }
  if (e.target.closest("[data-close]")) closeDrawer();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".card, .copy")) { e.preventDefault(); e.target.click(); }
});

// ---- markdown: headings, fences, lists (+ tasks), tables, paragraphs, inline code/bold/links ----
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function markdown(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  let i = 0, html = "";
  const t = tone(lines[0].trim());
  if (t) { html += `<div class="verdict ${t}">${esc(lines[0].trim())}</div>`; i = 1; }
  const isList = l => /^\s*([-*+]|\d+\.)\s+/.test(l);
  const isBlock = l => /^(#{1,6}\s|```|\|)/.test(l) || isList(l);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith("```")) { const b = []; i++; while (i < lines.length && !lines[i].startsWith("```")) b.push(lines[i++]); i++; html += `<pre><code>${esc(b.join("\n"))}</code></pre>`; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = Math.min(h[1].length, 3); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (line.startsWith("|")) {
      const rows = []; while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      html += "<table>" + rows.filter(r => !/^\|[\s:|-]+\|$/.test(r)).map((r, n) => `<tr>${cells(r).map(c => n ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("") + "</table>"; continue;
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++];
        if (isList(l)) items.push(l.replace(/^\s*([-*+]|\d+\.)\s+/, "")); else items[items.length - 1] += " " + l.trim();
      }
      html += (ordered ? "<ol>" : "<ul>") + items.map(x => { const m = x.match(/^\[([ xX])\]\s+(.*)$/); return m ? `<li class="task ${m[1] === " " ? "" : "done"}">${inline(m[2])}</li>` : `<li>${inline(x)}</li>`; }).join("") + (ordered ? "</ol>" : "</ul>"); continue;
    }
    const p = []; while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) p.push(lines[i++]);
    html += `<p>${inline(p.join(" "))}</p>`;
  }
  return html;
}

poll(); setInterval(poll, POLL_MS);
</script>
